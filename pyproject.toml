[project]
name = "jax-evolutionary-soups"
version = "0.1.0"
description = "JAX implementation of Evolutionary Soups (arXiv:2608.29978)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "optax>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evolutionary_soups*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
